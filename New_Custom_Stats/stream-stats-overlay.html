<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Stats Overlay Customizer</title>

<!-- Optional: an "overlay-config.js" exported from the Setup tab, sitting next to this file.
     Missing file = harmless 404. -->
<script src="overlay-config.js" onerror="void 0"></script>

<!-- ============ OVERLAY CSS (this exact block is copied into the exported overlay) ============ -->
<style id="ovcss">
html,body{margin:0;padding:0;background:transparent}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif}
#ov{display:flex;flex-wrap:wrap}
.panel{position:relative;display:flex;flex-direction:column;align-items:center}
.panel.gone{display:none}
.ptitle{white-space:nowrap;line-height:1.05;position:relative;z-index:4}
.pbanner{position:relative;background-repeat:no-repeat;background-position:center;display:flex;isolation:isolate}
.pinner{position:relative;z-index:2;flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.pvalue{white-space:nowrap;line-height:1.15;display:inline-block}
.psub{white-space:nowrap;line-height:1.1}
.pstack{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;overflow:hidden}
.pbadge{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-weight:800;overflow:hidden}
.pbadge img{width:100%;height:100%;object-fit:contain;display:block}
.ptitle.inside{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.scrollwrap{overflow:hidden;min-width:0;flex:1}
.scrollwrap .pvalue{will-change:transform}
@keyframes marq{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(var(--marq))}}
@keyframes fxPop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes fxFade{0%{opacity:0}100%{opacity:1}}
@keyframes fxUp{0%{transform:translateY(110%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes fxDown{0%{transform:translateY(-110%);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes fxLeft{0%{transform:translateX(70%);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes fxRight{0%{transform:translateX(-70%);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes fxFlip{0%{transform:rotateX(90deg);opacity:0}100%{transform:rotateX(0);opacity:1}}
@keyframes fxZoom{0%{transform:scale(2.2);opacity:0;filter:blur(6px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes fxGlitch{0%{transform:translate(0);opacity:.2}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}100%{transform:translate(0);opacity:1}}
@keyframes fxFlash{0%,100%{box-shadow:none}30%{box-shadow:0 0 30px 6px var(--flash)}}
@keyframes fxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes idlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
#sbchip{position:fixed;font:600 12px/1 "Segoe UI",sans-serif;padding:6px 10px;border-radius:20px;
  background:rgba(8,12,20,.72);color:#cfe0ff;border:1px solid rgba(120,160,255,.35);z-index:99;display:none}
#sbchip b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:6px;vertical-align:middle}
#sbchip.on b{background:#22c55e}
</style>

<!-- ============ EDITOR CSS (not exported) ============ -->
<style id="uicss">
:root{
  --ui-bg:#0d1117; --ui-bg2:#131a24; --ui-bg3:#1a2432; --ui-line:#263141;
  --ui-text:#dce6f5; --ui-dim:#8698b3; --ui-accent:#3b82f6; --ui-accent2:#22d3ee;
  --ui-good:#22c55e; --ui-bad:#ef4444;
}
*{box-sizing:border-box}
html,body{height:100%}
body.editing{background:var(--ui-bg);color:var(--ui-text)}
#editor{display:none;height:100%;grid-template-rows:auto 1fr}
body.editing #editor{display:grid}
#stage{display:none}
body.editing #stage{display:flex}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--ui-bg2);border-bottom:1px solid var(--ui-line);flex-wrap:wrap}
.topbar h1{font-size:15px;margin:0 8px 0 0;letter-spacing:.4px}
.topbar h1 span{color:var(--ui-accent)}
.spacer{flex:1}
.btn{background:var(--ui-bg3);color:var(--ui-text);border:1px solid var(--ui-line);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit}
.btn:hover{border-color:var(--ui-accent);color:#fff}
.btn.pri{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn.danger:hover{border-color:var(--ui-bad);color:#ffb4b4}
.main{display:grid;grid-template-columns:152px 400px 1fr;min-height:0}
.nav{background:var(--ui-bg2);border-right:1px solid var(--ui-line);padding:10px 8px;overflow:auto}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ui-dim);padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit}
.nav button:hover{background:var(--ui-bg3);color:var(--ui-text)}
.nav button.act{background:var(--ui-accent);color:#fff}
.panelsCol{overflow:auto;padding:14px;border-right:1px solid var(--ui-line);background:var(--ui-bg)}
.preview{overflow:auto;background:#15181d;position:relative}
.pvbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(13,17,23,.94);border-bottom:1px solid var(--ui-line);font-size:12px;color:var(--ui-dim);flex-wrap:wrap}
#stage{min-height:220px;padding:28px;align-items:flex-start;justify-content:center}
#stage.checker{background-image:linear-gradient(45deg,#23272e 25%,transparent 25%),linear-gradient(-45deg,#23272e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#23272e 75%),linear-gradient(-45deg,transparent 75%,#23272e 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0}
#stage.dark{background:#000}#stage.green{background:#00b140}#stage.shot{background:#1b2430}#stage.light{background:#dfe6ee}
.grp{background:var(--ui-bg2);border:1px solid var(--ui-line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.grp>h3{margin:0;padding:10px 12px;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ui-accent2);background:var(--ui-bg3);cursor:pointer;display:flex;justify-content:space-between}
.grp>.body{padding:12px}
.grp.closed>.body{display:none}
.row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:8px;margin-bottom:9px}
.row>label{font-size:12px;color:var(--ui-dim)}
.row .in{display:flex;align-items:center;gap:6px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--ui-bg);border:1px solid var(--ui-line);color:var(--ui-text);padding:6px 8px;border-radius:6px;font-size:12.5px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ui-accent)}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-bg);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--ui-accent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ui-accent);cursor:pointer}
.num{width:62px;flex:0 0 62px;text-align:center}
.hint{font-size:11.5px;color:var(--ui-dim);line-height:1.55;margin:6px 0 0}
.hint code,code{background:#0a0e14;border:1px solid var(--ui-line);padding:1px 5px;border-radius:4px;font-size:11.5px;color:#9fd0ff}
.pcard{border:1px solid var(--ui-line);border-radius:9px;margin-bottom:10px;background:var(--ui-bg3)}
.phead{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.phead b{font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{padding:10px;border-top:1px solid var(--ui-line)}
.pcard.closed .pbody{display:none}
.tag{font-size:10px;padding:2px 6px;border-radius:20px;background:#0a0e14;color:var(--ui-dim);border:1px solid var(--ui-line)}
.tag.tw{color:#c084fc;border-color:#6b21a8}.tag.ki{color:#6ee7b7;border-color:#065f46}.tag.yt{color:#fca5a5;border-color:#7f1d1d}.tag.an{color:#93c5fd;border-color:#1e40af}
#log{font:11.5px/1.5 ui-monospace,Consolas,monospace;background:#070a0f;border:1px solid var(--ui-line);border-radius:8px;padding:8px;height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word}
#log .ev{color:#7dd3fc}#log .ok{color:#86efac}#log .er{color:#fca5a5}#log .dm{color:#64748b}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{border-bottom:1px solid var(--ui-line);padding:5px 4px;text-align:left}
table.data th{color:var(--ui-dim);font-weight:600;font-size:11px;text-transform:uppercase}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;background:var(--ui-bg3);border:1px solid var(--ui-line)}
.pill.on{border-color:var(--ui-good);color:#86efac}.pill.off{border-color:var(--ui-bad);color:#fca5a5}
.help h4{margin:16px 0 6px;font-size:13px;color:var(--ui-accent2)}
.help p,.help li{font-size:12.5px;color:#b9c7dc;line-height:1.65}
.help ol,.help ul{padding-left:18px;margin:6px 0}
.help pre{background:#070a0f;border:1px solid var(--ui-line);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;color:#9fd0ff}
.drop{border:2px dashed var(--ui-line);border-radius:8px;padding:10px;text-align:center;font-size:11.5px;color:var(--ui-dim);margin-bottom:9px}
.drop.hot{border-color:var(--ui-accent);color:var(--ui-text)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{background:#2a1f09;border:1px solid #7c5a12;color:#fcd34d;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.6;margin-bottom:10px}
/* preset gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:440px;overflow:auto;padding:4px;background:#070a0f;border:1px solid var(--ui-line);border-radius:8px}
.gcell{height:38px;border:1px solid transparent;border-radius:5px;overflow:hidden;cursor:pointer;position:relative;background:#0d1117}
.gcell:hover{border-color:var(--ui-accent)}
.gcell.sel{border-color:var(--ui-accent2);box-shadow:0 0 0 1px var(--ui-accent2)}
.gcell .mini{width:330px;height:74px;transform:scale(.5);transform-origin:top left;position:absolute;top:0;left:0}
.galbar{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.galbar select{width:auto;flex:1;min-width:110px}
</style>
</head>
<body>

<div id="ovwrap"><div id="ov"></div></div>
<div id="sbchip"><b></b><span>offline</span></div>

<div id="editor">
  <div class="topbar">
    <h1>Stream Stats <span>Overlay Customizer</span></h1>
    <span id="connPill" class="pill off">Streamer.bot: offline</span>
    <span class="spacer"></span>
    <button class="btn" id="btnTest">Test all</button>
    <button class="btn pri" id="btnExportHtml">Export overlay HTML</button>
    <button class="btn" id="btnCfgFile">overlay-config.js</button>
    <button class="btn" id="btnUrl">Copy OBS URL</button>
    <button class="btn" id="btnExport">Export settings</button>
    <button class="btn" id="btnImport">Import</button>
    <button class="btn danger" id="btnReset">Reset</button>
    <button class="btn pri" id="btnSave">Save</button>
  </div>
  <div class="main">
    <div class="nav">
      <button data-tab="panels" class="act">Panels</button>
      <button data-tab="fonts">Fonts</button>
      <button data-tab="title">Title text</button>
      <button data-tab="value">Value text</button>
      <button data-tab="banner">Banner</button>
      <button data-tab="designs">Banner designs</button>
      <button data-tab="layout">Layout</button>
      <button data-tab="fx">Effects</button>
      <button data-tab="conn">Streamer.bot</button>
      <button data-tab="data">Live data</button>
      <button data-tab="setup">Setup / Help</button>
    </div>
    <div class="panelsCol" id="controls"></div>
    <div class="preview">
      <div class="pvbar">
        <span>Preview bg:</span>
        <select id="pvbg" style="width:110px">
          <option value="checker">Transparent</option>
          <option value="dark">Black</option>
          <option value="shot">Dark grey</option>
          <option value="light">Light</option>
          <option value="green">Green</option>
        </select>
        <span class="spacer"></span>
        <span id="pvsize" style="font-family:ui-monospace,monospace"></span>
      </div>
      <div id="stage" class="checker"></div>
    </div>
  </div>
</div>

function presetList(){
  var out=[];
  for(var s=0;s<SHAPES.length;s++) for(var t=0;t<THEMES.length;t++)
    out.push({ id:SHAPES[s].id+"|"+THEMES[t].id, shape:SHAPES[s], theme:THEMES[t],
               name:SHAPES[s].name+" · "+THEMES[t].name });
  return out;
}
function findPreset(id){
  var parts=String(id||"").split("|");
  var s=SHAPES.filter(function(x){return x.id===parts[0];})[0];
  var t=THEMES.filter(function(x){return x.id===parts[1];})[0];
  if(!s||!t) return null;
  return {id:id, shape:s, theme:t, name:s.name+" · "+t.name};
}
/* css for a preset: returns {outer, after}. `custom` overrides the theme colours. */
function presetCSS(p, frame, radius, custom){
  if(!p) return null;
  var sh=p.shape, th=p.theme;
  var f0=th.f[0], f1=th.f[1], b0=th.b[0], b1=th.b[1];
  if(custom && custom.on){ f0=custom.f1; f1=custom.f2; b0=custom.b1; b1=custom.b2; }
  var r = (radius!==undefined && radius!==null) ? radius : sh.r;
  var outer = "background-image:linear-gradient("+(custom&&custom.on?custom.angle:170)+"deg,"+f0+","+f1+");"+
              "background-size:auto;background-color:transparent;"+
              (sh.clip? "clip-path:"+sh.clip+";" : "")+
              "border-radius:"+r+"px;";
  var after = "content:'';position:absolute;inset:"+frame+"px;z-index:1;"+
              (sh.clip? "clip-path:"+sh.clip+";" : "")+
              "border-radius:"+Math.max(0,r-1)+"px;"+
              "background-image:linear-gradient(180deg,"+b0+","+b1+");";
  return {outer:outer, after:after};
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function deepMerge(base,over){
  var out=clone(base);
  if(!over||typeof over!=="object") return out;
  Object.keys(over).forEach(function(k){
    var b=out[k],o=over[k];
    if(Array.isArray(o)) out[k]=clone(o);
    else if(o&&typeof o==="object"&&b&&typeof b==="object"&&!Array.isArray(b)) out[k]=deepMerge(b,o);
    else if(o!==undefined) out[k]=o;
  });
  return out;
}
function b64e(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(s){ try{ var b=s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="="; return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; } }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }

}

      var s1=rr(w[t-2],17)^rr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;

    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];

  return String(tpl).replace(/\{(\w+)\}/g,function(_,k){ return String(vars&&vars[k]!==undefined?vars[k]:""); })
    .replace(/\(\s*\)|\[\s*\]/g,"").replace(/\s{2,}/g," ")
    .replace(/^[\s\-–—|,:]+|[\s\-–—|,:]+$/g,"").trim();
}
/* drops {amount} and whatever wraps it, so "{name} ({amount})" becomes "{name}" */
function stripAmount(tpl){
  var out=String(tpl).replace(/[\s\-–—|,:]*[\(\[]?\s*\{amount\}\s*[\)\]]?/g,"").trim();
  return out.indexOf("{")>=0 ? out : tpl;   /* never blank the whole line */
}
function panelTemplate(p){
  var def=STATS.filter(function(s){ return s.id===p.stat; })[0]||STATS[0];
  var tpl=p.fmt||def.fmt;
  return (p.showAmount===false) ? stripAmount(tpl) : tpl;
}
function timeAgo(ts){
  if(!ts) return "never";
  var s=Math.max(0,Math.floor((Date.now()-ts)/1000));
  if(s<60) return s+"s ago";
  var m=Math.floor(s/60); if(m<60) return m+"m ago";
  var h=Math.floor(m/60); if(h<24) return h+"h ago";
  return Math.floor(h/24)+"d ago";
}
/* opts: {stat, force, relayout} — the effect only plays when the shown text actually changes */
function paintValues(opts){
  opts=opts||{};
  (cfg.panels||[]).forEach(function(p){
    if(!p.on) return;
    if(opts.stat && p.stat!==opts.stat) return;
    var el=ovEl.querySelector('.panel[data-pid="'+p.id+'"]'); if(!el) return;
    var rec=getStat(p.platform,p.stat);
    var vars=rec?rec.vars:(cfg.seed[statKey(p.platform,p.stat)]||null);
    var vEl=el.querySelector(".pvalue"), sEl=el.querySelector(".psub");
    var txt=vars?fmtTemplate(panelTemplate(p),vars):"";
    if(!txt) txt=cfg.behavior.idleText||"";

    var known = Object.prototype.hasOwnProperty.call(lastTxt,p.id);
    var changed = known && lastTxt[p.id]!==txt;
    lastTxt[p.id]=txt;
    if(vEl.textContent!==txt) vEl.textContent=txt;

    if(sEl){
      var det = (p.showAmount===false) ? "" : (vars?(vars.detail||""):"");
      var sub = (cfg.sub.mode==="detail") ? det
              : (cfg.sub.mode==="timeago") ? (rec?timeAgo(rec.ts):"")
              : [det, rec&&timeAgo(rec.ts)].filter(Boolean).join(" · ");
      if(sEl.textContent!==sub) sEl.textContent=sub;
    }
    el.classList.toggle("gone", !!(cfg.behavior.hideEmpty&&!vars));

    /* an "any platform" panel shows the badge of whichever platform the value came from */
    if(cfg.badge.mode!=="none"&&p.platform==="any"){
      var want=(rec&&rec.platform)?rec.platform:"any";
      if(el.getAttribute("data-badge")!==want){
        var holder=el.querySelector(".pinner"), old=el.querySelector(".pbadge"), bh=badgeHTML(want);
        if(old) old.outerHTML=bh||"";
        else if(bh&&holder) holder.insertAdjacentHTML("afterbegin",bh);
        el.setAttribute("data-badge",want);
      }
    }

    if(changed||opts.relayout||opts.force) fitText(vEl);
    if(changed||opts.force) playFX(el,vEl);
  });
  paintChip();
}
function fitText(vEl){
  var V=cfg.value;
  vEl.style.animation="";
  vEl.style.fontSize=V.size+"px";
  var wrap=vEl.parentNode;
  if(V.overflow==="clip"){ vEl.style.textOverflow="ellipsis"; vEl.style.overflow="hidden"; vEl.style.display="block"; return; }
  vEl.style.textOverflow=""; vEl.style.overflow=""; vEl.style.display="inline-block";
  var avail=wrap.clientWidth; if(!avail) return;
  if(V.overflow==="shrink"){
    var size=V.size,guard=0;
    while(vEl.scrollWidth>avail&&size>(V.minSize||10)&&guard++<80){ size-=1; vEl.style.fontSize=size+"px"; }
  }else if(V.overflow==="scroll"){
    if(vEl.scrollWidth>avail+2){
      vEl.style.setProperty("--marq", -(vEl.scrollWidth-avail+6)+"px");
      vEl.style.animation="marq "+Math.max(6,(vEl.scrollWidth/26))+"s linear infinite alternate";
    }
  }
}
function playFX(panelEl,vEl){
  var fx=cfg.fx;
  var map={pop:"fxPop",fade:"fxFade",up:"fxUp",down:"fxDown",left:"fxLeft",right:"fxRight",flip:"fxFlip",zoom:"fxZoom",glitch:"fxGlitch"};
  if(fx.anim!=="none"&&map[fx.anim]){
    var keep=vEl.style.animation;
    vEl.style.animation="none"; void vEl.offsetWidth;
    vEl.style.animation=map[fx.anim]+" "+(fx.dur||600)+"ms cubic-bezier(.2,.9,.25,1)";
    if(cfg.value.overflow==="scroll"&&keep&&keep.indexOf("marq")>=0)
      setTimeout(function(){ vEl.style.animation=keep; },(fx.dur||600)+30);
  }
  var b=panelEl.querySelector(".pbanner");
  if(b&&(fx.flash||fx.shake)){
    var anims=[];
    if(fx.flash){ b.style.setProperty("--flash",fx.flashColor); anims.push("fxFlash "+(fx.dur||600)+"ms ease-out"); }
    if(fx.shake) anims.push("fxShake "+Math.min(600,(fx.dur||600))+"ms ease-in-out");
    b.style.animation="none"; void b.offsetWidth;
    b.style.animation=anims.join(",");
    if(cfg.fx.idle) setTimeout(function(){ b.style.animation="idlePulse 3.2s ease-in-out infinite"; },(fx.dur||600)+40);
  }
}
var chipEl=document.getElementById("sbchip");
function paintChip(){
  if(!chipEl) return;

  chipEl.style.display="block";

function refreshHeads(){
  controls.querySelectorAll(".pcard").forEach(function(card){
    var i=+card.getAttribute("data-i"), p=cfg.panels[i]; if(!p) return;
    var pl=S.PLATFORMS.filter(function(x){return x.id===p.platform;})[0]||S.PLATFORMS[3];
    var st=S.STATS.filter(function(x){return x.id===p.stat;})[0]||S.STATS[0];
    var head=card.querySelector(".phead");
    head.querySelector("b").textContent=p.label||"(no title)";
    var tags=head.querySelectorAll(".tag");
    if(tags[0]){ tags[0].className="tag "+pl.cls; tags[0].textContent=pl.name; }
    if(tags[1]) tags[1].textContent=st.name.replace("Latest ","");
  });
}
controls.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="fontSearch"){
    fontFilter=el.value;
    ["title.font","value.font"].forEach(function(p){
      var s=controls.querySelector('select[data-p="'+p+'"]');
      if(s) s.outerHTML=fontSelect(p);
    });
    return;
  }
  var path=el.getAttribute("data-p"); if(!path) return;
  var v;
  if(el.type==="checkbox") v=el.checked;
  else if(el.type==="number"||el.type==="range") v=parseFloat(el.value);
  else if(el.tagName==="SELECT"&&typeof getPath(path)==="number") v=parseFloat(el.value);
  else v=el.value;
  setPath(path,v);
  controls.querySelectorAll('[data-p="'+path+'"]').forEach(function(o){
    if(o===el) return;
    if(o.type==="checkbox") o.checked=!!getPath(path); else o.value=getPath(path);
  });
  rerender();
  if(path.indexOf("panels.")===0) refreshHeads();
  if(path==="banner.mode"||path==="banner.src"||path.indexOf("banner.custom")===0){ if(curTab==="designs") renderControls(); }
  if(curTab==="fonts"&&(path==="title.font"||path==="value.font")) renderControls();
});
controls.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="fShape"){ galShape=el.value; renderControls(); }
  if(el.id==="fTheme"){ galTheme=el.value; renderControls(); }
});
controls.addEventListener("click",function(e){
  var t=e.target;
  var cell=t.closest?t.closest(".gcell"):null;
  if(cell){
    cfg.banner.preset=cell.getAttribute("data-preset");
    if(cfg.banner.mode==="image"&&!cfg.banner.src) cfg.banner.mode="preset";
    rerender(); renderControls(); return;
  }
  if(t.tagName==="H3"||(t.parentNode&&t.parentNode.tagName==="H3")){
    var g=t.closest(".grp"); if(g){ g.classList.toggle("closed"); return; }
  }
  if(t.closest(".phead")&&t.tagName!=="INPUT"){ t.closest(".pcard").classList.toggle("closed"); return; }

  if(t.id==="addPanel"){ cfg.panels.push(S.mkPanel(Date.now()%100000,"twitch","follower","NEW PANEL")); rerender(); renderControls(); return; }
  if(t.id==="dupLast"){ var l=cfg.panels[cfg.panels.length-1];
    if(l){ var c=clone(l); c.id="p"+(Date.now()%100000); cfg.panels.push(c); rerender(); renderControls(); } return; }
  if(t.id==="btnConnect"){ S.SB.connect(); return; }
  if(t.id==="btnDisconnect"){ S.SB.disconnect(); return; }
  if(t.id==="saveMaps"){
    try{ var m=JSON.parse(document.getElementById("mapsBox").value||"[]");
      if(!Array.isArray(m)) throw new Error("must be a list");
      cfg.maps=m; toast("Mappings applied","ok"); if(S.SB.connected) S.SB.subscribe();
    }catch(err){ toast("Bad JSON: "+err.message,"er"); } return;
  }
  if(t.id==="applyManual"||t.id==="seedManual"){
    var seed=(t.id==="seedManual");
    controls.querySelectorAll(".manName").forEach(function(inp){
      var i=+inp.getAttribute("data-i"),p=cfg.panels[i]; if(!p) return;
      var amt=controls.querySelector('.manAmt[data-i="'+i+'"]');
      if(!inp.value&&!(amt&&amt.value)) return;
      var vars={name:inp.value,amount:amt?amt.value:"",detail:amt?amt.value:"",months:"",tier:"",message:""};
      S.setStat(p.stat,p.platform,vars);
      if(seed) cfg.seed[S.statKey(p.platform,p.stat)]=vars;
    });
    renderControls(); toast(seed?"Saved as startup values":"Applied","ok"); return;
  }
  if(t.id==="dataClear"){ if(confirm("Clear every stored value?")){ S.setData({stats:{},meta:S.data().meta}); S.saveData(); rerender(); renderControls(); } return; }
  if(t.id==="dataExport"){ download("overlay-data.json",JSON.stringify(S.data(),null,2)); return; }
  if(t.id==="dataImport"){ pickFile(function(txt){
    try{ var d=JSON.parse(txt); S.setData({stats:d.stats||{},meta:d.meta||{lastOnline:0,lastSeen:0}});
      S.saveData(); rerender(); renderControls(); toast("Data imported","ok"); }
    catch(e){ toast("Bad file","er"); } }); return; }

  var act=t.getAttribute("data-act"); if(!act) return;
  var i=+t.getAttribute("data-i"), k=t.getAttribute("data-k");
  if(act==="del"){ if(confirm("Delete this panel?")){ cfg.panels.splice(i,1); rerender(); renderControls(); } }
  else if(act==="up"&&i>0){ var a=cfg.panels.splice(i,1)[0]; cfg.panels.splice(i-1,0,a); rerender(); renderControls(); }
  else if(act==="down"&&i<cfg.panels.length-1){ var b=cfg.panels.splice(i,1)[0]; cfg.panels.splice(i+1,0,b); rerender(); renderControls(); }
  else if(act==="test"){ testPanel(cfg.panels[i]); }
  else if(act==="steal"){
    var th=S.THEMES.filter(function(x){ return x.id===t.getAttribute("data-theme"); })[0];
    if(th){ cfg.banner.custom.on=true; cfg.banner.custom.f1=th.f[0]; cfg.banner.custom.f2=th.f[1];
            cfg.banner.custom.b1=th.b[0]; cfg.banner.custom.b2=th.b[1];
            rerender(); renderControls(); }
  }
  else if(act==="clr"){ delete S.data().stats[k]; S.saveData(); rerender(); renderControls(); }
  else if(act==="undo"){
    var rec=S.data().stats[k];
    if(rec&&rec.history&&rec.history.length){
      var prev=rec.history.pop();
      S.data().stats[k]={vars:prev.vars,ts:prev.ts,platform:prev.platform,history:rec.history};
      S.saveData(); rerender(); renderControls();
    }
  }
});
function wireDropzone(){
  var dz=document.getElementById("dropzone"); if(!dz) return;
  ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.add("hot"); }); });
  ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); dz.classList.remove("hot"); }); });
  dz.addEventListener("drop",function(e){
    var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
    cfg.banner.src=f.name; cfg.banner.mode="image";
    renderControls(); rerender();
    toast('Banner set to "'+f.name+'" — keep that file next to the overlay',"ok");
  });
}

var TEST_NAMES=["xXDragonSlayerXx","NovaKnight","pixel_priestess","Gl1tchW1tch","ToastedMarshmallow",
 "Kr4kenKing","Mango_Mori","SynthWaveSam","QuietThunder","BiscuitOverlord"];
function testPanel(p){
  if(!p) return;
  var v={name:TEST_NAMES[Math.floor(Math.random()*TEST_NAMES.length)],amount:"",detail:"",
         months:String(1+Math.floor(Math.random()*40)),tier:"1",message:""};
  if(p.stat==="cheer") v.amount=(100*(1+Math.floor(Math.random()*50)))+" bits";
  else if(p.stat==="raid") v.amount=(2+Math.floor(Math.random()*400))+" viewers";
  else if(p.stat==="giftsub") v.amount=String(1+Math.floor(Math.random()*20));
  else if(p.stat==="subscriber") v.amount=v.months+" mo";
  else if(p.stat==="superchat"||p.stat==="donation") v.amount="$"+(5*(1+Math.floor(Math.random()*8))).toFixed(2);
  else if(p.stat==="viewers"){ v.name=""; v.amount=String(10+Math.floor(Math.random()*5000)); }
  v.detail=String(v.amount);
  S.setStat(p.stat,p.platform,v,{force:true});
}

function download(name,text,type){
  var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1200);
}
function pickFile(cb){
  var i=document.createElement("input"); i.type="file"; i.accept=".json,.js,text/plain";
  i.onchange=function(){ var f=i.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ cb(String(r.result)); }; r.readAsText(f); };
  i.click();
}

  toast(S.lsSet(S.CFG_KEY,cfg)?"Saved to this browser":"Could not write local storage", S.lsSet(S.CFG_KEY,cfg)?"ok":"er");
};
document.getElementById("btnCfgFile").onclick=function(){
  cfg.savedAt=Date.now(); S.lsSet(S.CFG_KEY,cfg);
  download("overlay-config.js","/* Stream stats overlay — generated "+new Date().toLocaleString()+" */\nwindow.OVERLAY_CONFIG = "+JSON.stringify(cfg,null,1)+";\n","application/javascript");
  toast("Put overlay-config.js next to the HTML","ok");
};
document.getElementById("btnUrl").onclick=function(){
  cfg.savedAt=Date.now();
  var url=location.href.split("#")[0].split("?")[0]+"#cfg="+S.b64e(cfg);
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(
    function(){ toast("OBS URL copied ("+url.length+" chars)","ok"); },
    function(){ prompt("Copy this URL into the OBS browser source:",url); });
  else prompt("Copy this URL into the OBS browser source:",url);
};
document.getElementById("btnExport").onclick=function(){
  cfg.savedAt=Date.now(); download("overlay-settings.json",JSON.stringify(cfg,null,2),"application/json");
};
document.getElementById("btnImport").onclick=function(){
  pickFile(function(txt){
    try{
      var t=txt.replace(/^[\s\S]*?window\.OVERLAY_CONFIG\s*=\s*/,"").replace(/;\s*$/,"");
      cfg=S.deepMerge(S.DEFAULTS,JSON.parse(t)); S.setCfg(cfg);
      rerender(); renderControls(); toast("Settings loaded","ok");
    }catch(e){ toast("Could not read that file","er"); }
  });
};
document.getElementById("btnReset").onclick=function(){
  if(!confirm("Reset the whole design back to defaults?")) return;
  cfg=clone(S.DEFAULTS); S.setCfg(cfg); rerender(); renderControls();
};
document.querySelectorAll(".nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll(".nav button").forEach(function(x){ x.classList.remove("act"); });
    b.classList.add("act"); curTab=b.getAttribute("data-tab"); renderControls();
  };
});
document.getElementById("pvbg").onchange=function(){ stage.className=this.value; };

renderControls();
setTimeout(updatePvSize,120);
})();
</script>
</body>
</html>
